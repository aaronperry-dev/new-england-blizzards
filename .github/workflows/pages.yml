name: Deploy site

# Publishes ./site to GitHub Pages.  Runs on pushes that touch the site, and is also called by
# "Build data & deploy" with freshly built data.
# One-time setup: Repository → Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_call:
    inputs:
      fresh_data:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use freshly built data
        if: ${{ inputs.fresh_data }}
        uses: actions/download-artifact@v4
        with:
          name: site-data
          path: site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
